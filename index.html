<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mad Labs FX | Ideas In Motion</title>
<style>
:root {
--bg-color: #0b0c10;
--card-bg: #12141c;
--gold-primary: #d4af37;
--gold-light: #f3e5ab;
--text-main: #e0e0e0;
--text-muted: #888888;
--border-gold: rgba(212, 175, 55, 0.3);
}
​* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
​body {
background-color: var(--bg-color);
color: var(--text-main);
min-height: 100vh;
display: flex;
flex-direction: column;
overflow-x: hidden;
}
​/* --- HEADER --- */
header {
display: flex;
justify-content: space-between;
align-items: center;
padding: 20px 40px;
border-bottom: 1px solid var(--border-gold);
background: rgba(11, 12, 16, 0.95);
position: sticky;
top: 0;
z-index: 100;
}
​.brand-logo {
font-size: 1.4rem;
font-weight: 800;
letter-spacing: 2px;
color: var(--gold-primary);
text-transform: uppercase;
}
​.brand-sub {
font-size: 0.7rem;
display: block;
color: var(--text-muted);
letter-spacing: 3px;
margin-top: 2px;
}
​.utility-dock {
display: flex;
gap: 25px;
align-items: center;
}
​.dock-btn {
background: none;
border: 1px solid var(--border-gold);
color: var(--gold-light);
padding: 8px 16px;
border-radius: 4px;
cursor: pointer;
font-size: 0.8rem;
letter-spacing: 1px;
text-transform: uppercase;
transition: all 0.3s ease;
}
​.dock-btn:hover {
background: var(--gold-primary);
color: var(--bg-color);
box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
}
​/* --- MAIN CAROUSEL STAGE --- */
main {
flex: 1;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
padding: 40px 20px;
position: relative;
}
​.carousel-container {
width: 100%;
max-width: 600px;
text-align: center;
position: relative;
}
​.slider-controls {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 20px;
}
​.nav-arrow {
background: none;
border: none;
color: var(--gold-primary);
font-size: 2.5rem;
cursor: pointer;
padding: 0 20px;
transition: transform 0.2s ease;
}
​.nav-arrow:hover {
transform: scale(1.2);
color: var(--gold-light);
}
​.slide-card {
background: var(--card-bg);
border: 1px solid var(--border-gold);
border-radius: 12px;
padding: 60px 30px;
cursor: pointer;
transition: all 0.4s ease;
box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
​.slide-card:hover {
border-color: var(--gold-primary);
box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
transform: translateY(-4px);
}
​.division-title {
font-size: 2rem;
color: var(--gold-primary);
margin-bottom: 10px;
text-transform: uppercase;
letter-spacing: 2px;
}
​.division-desc {
color: var(--text-muted);
font-size: 1rem;
letter-spacing: 1px;
}
​.slide-hint {
margin-top: 30px;
font-size: 0.8rem;
color: var(--gold-light);
text-transform: uppercase;
letter-spacing: 1px;
opacity: 0.7;
}
​/* --- SLIDING DRAWER --- */
.drawer-overlay {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0, 0, 0, 0.8);
backdrop-filter: blur(5px);
z-index: 200;
opacity: 0;
pointer-events: none;
transition: opacity 0.3s ease;
}
​.drawer-overlay.active {
opacity: 1;
pointer-events: auto;
}
​.drawer-content {
position: fixed;
bottom: -100%;
left: 0;
width: 100%;
max-height: 80vh;
background: var(--card-bg);
border-top: 2px solid var(--gold-primary);
border-radius: 20px 20px 0 0;
padding: 40px;
z-index: 201;
overflow-y: auto;
transition: bottom 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
}
​.drawer-overlay.active .drawer-content {
bottom: 0;
}
​.drawer-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 30px;
border-bottom: 1px solid var(--border-gold);
padding-bottom: 15px;
}
​.drawer-close {
background: none;
border: none;
color: var(--gold-primary);
font-size: 1.8rem;
cursor: pointer;
}
​.catalog-grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
gap: 20px;
margin-top: 20px;
}
​.catalog-item {
background: rgba(255, 255, 255, 0.03);
border: 1px solid rgba(212, 175, 55, 0.15);
padding: 20px;
border-radius: 8px;
text-align: left;
}
​.catalog-item h4 {
color: var(--gold-light);
margin-bottom: 8px;
}
​.catalog-item p {
color: var(--text-muted);
font-size: 0.85rem;
line-height: 1.4;
}
​/* --- FOOTER --- */
footer {
text-align: center;
padding: 20px;
border-top: 1px solid var(--border-gold);
color: var(--text-muted);
font-size: 0.75rem;
letter-spacing: 1px;
}
</style>
</head>
<body>
​<header>
<div>
<span class="brand-logo">Mad Labs FX</span>
<span class="brand-sub">Ideas In Motion</span>
</div>
<div class="utility-dock">
<button class="dock-btn">Search</button>
<button class="dock-btn">Vault Access</button>
<button class="dock-btn">Contact</button>
</div>
</header>
​<main>
<div class="carousel-container">
<div class="slider-controls">
<button class="nav-arrow" onclick="prevSlide()">❮</button>
<div style="flex: 1;">
<div class="slide-card" onclick="openDrawer()">
<h2 class="division-title" id="slide-title">Mad Labs Press</h2>
<p class="division-desc" id="slide-desc">Publishing, Print & General Literature</p>
<div class="slide-hint">Tap to Open Catalog</div>
</div>
</div>
<button class="nav-arrow" onclick="nextSlide()">❯</button>
</div>
</div>
</main>
​<div class="drawer-overlay" id="drawer" onclick="closeDrawer(event)">
<div class="drawer-content" onclick="event.stopPropagation()">
<div class="drawer-header">
<h3 id="drawer-title" style="color: var(--gold-primary); text-transform: uppercase;">Division Catalog</h3>
<button class="drawer-close" onclick="closeDrawer(null)">×</button>
</div>
<p id="drawer-description" style="color: var(--text-muted); margin-bottom: 20px;"></p>
<div class="catalog-grid" id="catalog-list">
<!-- Dynamic Content Loads Here -->
</div>
</div>
</div>
​<footer>
© MAD LABS FX. ALL RIGHTS RESERVED.
</footer>
​<script>
const divisions = [
{
title: "Mad Labs Press",
desc: "Publishing, Print & General Literature",
catalog: [
{ title: "Standard Publications", desc: "Core editorial and independent print releases." },
{ title: "Special Editions", desc: "Limited run hardcovers and collector prints." }
]
},
{
title: "Mad Labs Stories",
desc: "Children's Storybooks & Kids Print",
catalog: [
{ title: "Illustrated Classics", desc: "Full-color original storybooks and series." },
{ title: "Activity Packs", desc: "Interactive printable media for young creators." }
]
},
{
title: "Mad Labs Learn",
desc: "Classroom Materials, Handbooks & Guides",
catalog: [
{ title: "Educational Handbooks", desc: "Structured guides and reference manuals." },
{ title: "Digital PDF Vault", desc: "Direct download curriculum and instructional assets." }
]
}
];
​let currentIndex = 0;
​function updateSlide() {
document.getElementById('slide-title').innerText = divisions[currentIndex].title;
document.getElementById('slide-desc').innerText = divisions[currentIndex].desc;
}
​function nextSlide() {
currentIndex = (currentIndex + 1) % divisions.length;
updateSlide();
}
​function prevSlide() {
currentIndex = (currentIndex - 1 + divisions.length) % divisions.length;
updateSlide();
}
​function openDrawer() {
const current = divisions[currentIndex];
document.getElementById('drawer-title').innerText = current.title;
document.getElementById('drawer-description').innerText = current.desc;
​const listContainer = document.getElementById('catalog-list');
listContainer.innerHTML = current.catalog.map(item => <div class="catalog-item"> <h4>${item.title}</h4> <p>${item.desc}</p> </div>).join('');
​document.getElementById('drawer').classList.add('active');
}
​function closeDrawer(event) {
if (!event || event.target.id === 'drawer' || event.target.classList.contains('drawer-close')) {
document.getElementById('drawer').classList.remove('active');
}
}
</script>
</body>
</html>
